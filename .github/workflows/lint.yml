name: Lint Shell Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          echo "Scanning shell scripts..."
          find . -type f \( -name "*.sh" -o -path "*/scripts/*" \) \
            ! -path "*/.git/*" \
            -exec file {} + | grep -i "shell script" | cut -d: -f1 | \
            xargs -r shellcheck --severity=warning
