# Kitty Terminal Configuration
# ============================

# Font
font_family      MesloLGS Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# Cursor
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 150
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2


# Scrollback
scrollback_lines 10000


# Scrollbar
scrollbar scrolled
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_width 0.5
scrollbar_handle_opacity 0.5
scrollbar_radius 0.3
scrollbar_handle_color foreground

# Mouse
mouse_hide_wait 3.0
url_color #89b4fa
url_style curly

# Window
remember_window_size  yes
initial_window_width  100c
initial_window_height 35c
window_padding_width 10
background_opacity 0.85
confirm_os_window_close 0
hide_window_decorations no
# Shell
shell /bin/zsh

# Detecta automáticamente X11 o Wayland según el entorno GNOME
linux_display_server auto

# Scroll Wayland
pixel_scroll yes
momentum_scroll 0.96

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Remote Control (para cambio dinámico de temas al vuelo)
allow_remote_control yes
listen_on unix:@mykitty

# Cargar paleta de colores activa
include themes/catppuccin-mocha.conf

# Keybindings
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map shift+t launch --cwd=current
map shift+w close_window
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+c send_text all \x03

enabled_layouts horizontal
