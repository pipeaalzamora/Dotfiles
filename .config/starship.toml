# ============================================================
# Starship — Prompt minimalista y rápido
# ============================================================

add_newline = false
palette = catppuccin_mocha

# ============================================================
# Paleta Catppuccin Mocha
# ============================================================
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext0 = "#a6adc8"
subtext1 = "#bac2de"
surface0 = "#313244"
surface1 = "#45475a"
surface2 = "#585b70"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
overlay2 = "#9399b2"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# ============================================================
# Prompt básico
# ============================================================
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold yellow)"

# ============================================================
# Git
# ============================================================
[git_status]
delimited = true
stashed = "[+$count](bold yellow) "
stashed.disabled = false

[git_branch]
style = "bold purple"

[git_commit]
commit_hash_length = 7
style = "bold white"

[git_state]
style = "bold yellow"

# ============================================================
# Directorio
# ============================================================
[directory]
style = "bold blue"
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "📁"
"Descargas" = "📥"
"M música" = "🎵"
"Im ágenes" = "🖼️"
"Ví¡¡deos" = "🎥"
"Desarrollo" = "💻"
"Proyectos" = "🚀"
"Documentos" = "📄"
".config" = "⚙️"

# ============================================================
# Herramientas de desarrollo
# ============================================================
[python]
symbol = "🐍 "
style = "yellow"

[nodejs]
symbol = "🟢 "
style = "green"

[bun]
symbol = "🐇 "
style = "red"

[rust]
symbol = "🦀 "
style = "orange"

[golang]
symbol = "🐹 "
style = "blue"

[docker_context]
symbol = "🐋 "
style = "blue"

[kubernetes]
symbol = "☸️ "
style = "blue"

[terraform]
symbol = "🏗️ "
style = "purple"

[aws]
symbol = "🅰️ "
style = "yellow"

[azure]
symbol = "🅰️ "
style = "blue"

[gcloud]
symbol = "🅶 "
style = "blue"

[package]
symbol = "📦 "
style = "yellow"

# ============================================================
# Sistema
# ============================================================
[time]
disabled = false
style = "bold yellow"
format = "[🕙 $time]($style) "
time_format = "%H:%M"

[battery]
disabled = false
full_symbol = "🔋 "
charging_symbol = "⚡ "
discharging_symbol = "🪫 "

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 60
style = "bold green"

# ============================================================
# Shell y hostname
# ============================================================
[shell]
disabled = false

[username]
disabled = false
style_user = "bold blue"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
disabled = false
style = "bold green"
format = "[$hostname](bold green)"

# ============================================================
# Otros módulos
# ============================================================
[cmd_duration]
style = "bold yellow"
format = "[$duration]($style) "

[line_break]
disabled = false

[status]
disabled = false
style = "bold red"
format = "[$symbol$int]($style) "
symbol = "✗ "
